services:
  app:
    image: draegar/spring-petclinic:latest
    ports:
      - "8082:8080" # Redirige le 8080 du conteneur vers le 8082 de la VM
    environment:
      - SPRING_PROFILES_ACTIVE=mysql # Ou postgres selon votre choix
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic
    depends_on:
      - mysql
    restart: always
  mysql:
    image: mysql:9.5
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
  postgres:
    image: postgres:18.1
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_DB=petclinic
